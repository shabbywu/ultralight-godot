name: Build Mini Browser
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to build and upload (empty = build only)'
        required: false
        type: string

permissions:
  contents: read

env:
  # Only used for the cache key. Increment version to force clean build.
  GODOT_BASE_BRANCH: main
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
  cancel-in-progress: false

jobs:
  cmake:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
        - name: 🏁 Build (Windows, MSVC, x86_64)
          os: windows-2022
          artifact: windows-x64
          env:
            VCPKG_DEFAULT_TRIPLET: x64-windows
          Release_configurePresetAdditionalArgs: "['-DCMAKE_BUILD_TYPE=\"Release\"']"
          Release_buildPresetAdditionalArgs: '[`--config Release`, `--target mini-browser`]'
        - name: 🐧 Build (Linux, GCC, x86_64)
          os: ubuntu-24.04
          artifact: linux-x64
          env:
            VCPKG_DEFAULT_TRIPLET: x64-linux
            CC:   gcc-13
            CXX:  g++-13
          Release_configurePresetAdditionalArgs: "['-DCMAKE_BUILD_TYPE=\"Release\"']"
          Release_buildPresetAdditionalArgs: '[`--config Release`, `--target mini-browser`]'
        - name: 🍎 Build (MacOS, Clang, arm64)
          os: macos-latest
          artifact: macos-arm64
          env:
            VCPKG_DEFAULT_TRIPLET: arm64-osx
          Release_configurePresetAdditionalArgs: "['-DCMAKE_OSX_ARCHITECTURES=\"arm64\"', '-DCMAKE_BUILD_TYPE=\"Release\"']"
          Release_buildPresetAdditionalArgs: '[`--config Release`, `--target mini-browser`]'

    env: ${{ matrix.env }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}

      # The pinned vcpkg dependencies require legacy policies removed in CMake 4.
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: '3.31.6'

      # Setup vcpkg: ensures vcpkg is downloaded and built.
      # Since vcpkg.json is being used later on to install the packages
      # when `run-cmake` runs, no packages are installed at this time
      # (and vcpkg does not run).
      - name: Setup anew (or from cache) vcpkg (and does not build any package)
        uses: lukka/run-vcpkg@v11 # Always specify the specific _version_ of the
                                  # action you need, `v11` in this case to stay up
                                  # to date with fixes on the v11 branch.
        with:
          vcpkgGitCommitId: '0699a19d0c6386247ce50d4dedbb8217d484d536'

      - name: Install dependencies
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qqq build-essential pkg-config gcc-13 g++-13 libx11-dev libx11-xcb-dev libxcb1-dev libxcb-present-dev libfontconfig1-dev

      - name: Run CMake consuming CMakePreset.json (Release)
        uses: lukka/run-cmake@v10
        with:
          configurePreset: default
          configurePresetAdditionalArgs: ${{ matrix.Release_configurePresetAdditionalArgs }}
          buildPreset: default
          buildPresetAdditionalArgs: ${{ matrix.Release_buildPresetAdditionalArgs }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.artifact }}
          path: bin/mini-browser
          if-no-files-found: error
          retention-days: 3

  archive:
    name: Archive all prebuilt binary
    runs-on: ubuntu-24.04
    needs:
    - cmake
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: build-*
          merge-multiple: true
      - name: Package mini-browser with SDK runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y p7zip-full
          mkdir -p dist
          for platform in x11 win64 macos-arm64; do
            case "$platform" in
              x11) asset=linux; executable=mini-browser; prefix=lib; suffix=so ;;
              win64) asset=win64; executable=mini-browser.exe; prefix=; suffix=dll ;;
              macos-arm64) asset=macos-arm64; executable=mini-browser; prefix=lib; suffix=dylib ;;
            esac
            test -s "artifacts/$platform/$executable"
            if [ "$platform" != win64 ]; then
              chmod +x "artifacts/$platform/$executable"
            fi
            for library in Ultralight UltralightCore WebCore AppCore; do
              test -s "artifacts/$platform/${prefix}${library}.${suffix}"
            done
            (cd "artifacts/$platform" && 7z a -t7z "../../dist/mini-browser.$asset.7z" .)
          done

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mini-browser-packages
          path: dist/*.7z
          if-no-files-found: error
          retention-days: 7

      - name: Upload release assets
        if: ${{ env.RELEASE_TAG != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" dist/*.7z --clobber
