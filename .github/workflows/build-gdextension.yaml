name: Build GDExtension
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to build and upload (empty = build only)'
        required: false
        type: string

permissions:
  contents: read

env:
  # Only used for the cache key. Increment version to force clean build.
  GODOT_BASE_BRANCH: main
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
  cancel-in-progress: false

jobs:
  cmake:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
        - name: 🏁 Build (Windows, MSVC, x86_64)
          os: windows-2022
          artifact: windows-x64
          env:
            VCPKG_DEFAULT_TRIPLET: x64-windows
          Debug_configurePresetAdditionalArgs: "['-DCMAKE_BUILD_TYPE=\"Debug\"']"
          Debug_buildPresetAdditionalArgs: '[`--config Debug`]'
          Release_configurePresetAdditionalArgs: "['-DCMAKE_BUILD_TYPE=\"Release\"']"
          Release_buildPresetAdditionalArgs: '[`--config Release`]'
        - name: 🐧 Build (Linux, GCC, x86_64)
          os: ubuntu-24.04
          artifact: linux-x64
          env:
            VCPKG_DEFAULT_TRIPLET: x64-linux
            CC:   gcc-13
            CXX:  g++-13
          Debug_configurePresetAdditionalArgs: "['-DCMAKE_BUILD_TYPE=\"Debug\"']"
          Debug_buildPresetAdditionalArgs: '[`--config Debug`]'
          Release_configurePresetAdditionalArgs: "['-DCMAKE_BUILD_TYPE=\"Release\"']"
          Release_buildPresetAdditionalArgs: '[`--config Release`]'
        - name: 🍎 Build (MacOS, Clang, arm64)
          os: macos-latest
          artifact: macos-arm64
          env:
            VCPKG_DEFAULT_TRIPLET: arm64-osx
          Debug_configurePresetAdditionalArgs: "['-DCMAKE_OSX_ARCHITECTURES=\"arm64\"', '-DCMAKE_BUILD_TYPE=\"Debug\"']"
          Debug_buildPresetAdditionalArgs: '[`--config Debug`]'
          Release_configurePresetAdditionalArgs: "['-DCMAKE_OSX_ARCHITECTURES=\"arm64\"', '-DCMAKE_BUILD_TYPE=\"Release\"']"
          Release_buildPresetAdditionalArgs: '[`--config Release`]'

    env: ${{ matrix.env }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}

      # The pinned vcpkg dependencies require legacy policies removed in CMake 4.
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: '3.31.6'

      # Setup vcpkg: ensures vcpkg is downloaded and built.
      # Since vcpkg.json is being used later on to install the packages
      # when `run-cmake` runs, no packages are installed at this time
      # (and vcpkg does not run).
      - name: Setup anew (or from cache) vcpkg (and does not build any package)
        uses: lukka/run-vcpkg@v11 # Always specify the specific _version_ of the
                                  # action you need, `v11` in this case to stay up
                                  # to date with fixes on the v11 branch.
        with:
          vcpkgGitCommitId: '0699a19d0c6386247ce50d4dedbb8217d484d536'

      - name: Install dependencies
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qqq build-essential pkg-config gcc-13 g++-13

      - name: Run CMake consuming CMakePreset.json (Debug)
        uses: lukka/run-cmake@v10
        with:
          configurePreset: default
          configurePresetAdditionalArgs: ${{ matrix.Debug_configurePresetAdditionalArgs }}
          buildPreset: default
          buildPresetAdditionalArgs: ${{ matrix.Debug_buildPresetAdditionalArgs }}

      - name: Run CMake consuming CMakePreset.json (Release)
        uses: lukka/run-cmake@v10
        with:
          configurePreset: default
          configurePresetAdditionalArgs: ${{ matrix.Release_configurePresetAdditionalArgs }}
          buildPreset: default
          buildPresetAdditionalArgs: ${{ matrix.Release_buildPresetAdditionalArgs }}

      - name: Run SDK regression tests
        run: ctest --test-dir build/default -C Release --output-on-failure

      - name: Install Godot for CPU and JS validation
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        run: |
          curl -L --fail https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip /tmp/godot.zip -d /tmp/godot-sdk2
          chmod +x /tmp/godot-sdk2/Godot_v4.3-stable_linux.x86_64

      - name: Validate Godot CPU fallback and JS compatibility
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        run: python3 tests/gpu/run.py --godot /tmp/godot-sdk2/Godot_v4.3-stable_linux.x86_64 --library bin/x11/libultralight-view.linux.release.x86_64.so --backend headless --output build/godot-validation

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.artifact }}
          path: bin
          if-no-files-found: error
          retention-days: 3

  archive:
    name: Archive all prebuilt library
    runs-on: ubuntu-24.04
    needs:
    - cmake
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts/addons/ultralight-view/bin
          pattern: build-*
          merge-multiple: true
      - name: generate ultralight-view.gdextension
        run: |
          cat > artifacts/addons/ultralight-view/ultralight-view.gdextension <<EOF
          [configuration]
          entry_symbol = "ultralight_library_init"
          compatibility_minimum = "4.3"

          [libraries]
          macos.debug.arm64 = "bin/macos-arm64/libultralight-view.macos.debug.arm64.dylib"
          macos.release.arm64 = "bin/macos-arm64/libultralight-view.macos.release.arm64.dylib"
          windows.debug.x86_64 = "bin/win64/ultralight-view.windows.debug.x86_64.dll"
          windows.release.x86_64 = "bin/win64/ultralight-view.windows.release.x86_64.dll"
          linux.debug.x86_64 = "bin/x11/libultralight-view.linux.debug.x86_64.so"
          linux.release.x86_64 = "bin/x11/libultralight-view.linux.release.x86_64.so"
          EOF
      - name: Package GDExtension with SDK runtime libraries
        env:
          PACKAGE_VERSION: ${{ env.RELEASE_TAG || github.ref_name }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y p7zip-full
          for platform in x11 win64 macos-arm64; do
            case "$platform" in
              x11) os=linux; arch=x86_64; prefix=lib; suffix=so ;;
              win64) os=windows; arch=x86_64; prefix=; suffix=dll ;;
              macos-arm64) os=macos; arch=arm64; prefix=lib; suffix=dylib ;;
            esac
            directory="artifacts/addons/ultralight-view/bin/$platform"
            for configuration in debug release; do
              test -s "$directory/${prefix}ultralight-view.$os.$configuration.$arch.$suffix"
            done
            for library in Ultralight UltralightCore WebCore; do
              test -s "$directory/${prefix}${library}.${suffix}"
            done
          done
          mkdir -p dist
          version="${PACKAGE_VERSION//\//-}"
          (cd artifacts && 7z a -t7z "../dist/ultralight-view.$version.gdextension.7z" addons)

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ultralight-view-package
          path: dist/*.7z
          if-no-files-found: error
          retention-days: 7

      - name: Upload release assets
        if: ${{ env.RELEASE_TAG != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" dist/*.7z --clobber
